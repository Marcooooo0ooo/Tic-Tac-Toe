<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Cartoon robot</title>
  <!-- shadow -->
  <ellipse cx="100" cy="214" rx="62" ry="6" fill="#000" opacity=".15"/>
  <!-- antenna -->
  <line x1="100" y1="24" x2="100" y2="44" stroke="#1b1f5e" stroke-width="5" stroke-linecap="round"/>
  <circle cx="100" cy="16" r="9" fill="#ffd166" stroke="#1b1f5e" stroke-width="4"/>
  <!-- side bolts -->
  <rect x="24" y="78" width="16" height="36" rx="6" fill="#1581c4" stroke="#1b1f5e" stroke-width="4"/>
  <rect x="160" y="78" width="16" height="36" rx="6" fill="#1581c4" stroke="#1b1f5e" stroke-width="4"/>
  <!-- head -->
  <rect x="40" y="44" width="120" height="92" rx="26" fill="#4cc9f0" stroke="#1b1f5e" stroke-width="5"/>
  <!-- screen face -->
  <rect x="54" y="58" width="92" height="62" rx="16" fill="#1b1f5e"/>
  <circle cx="80" cy="84" r="11" fill="#7ff5e1"/>
  <circle cx="120" cy="84" r="11" fill="#7ff5e1"/>
  <circle cx="84" cy="80" r="3.5" fill="#fff"/>
  <circle cx="124" cy="80" r="3.5" fill="#fff"/>
  <path d="M82 104 Q100 116 118 104" fill="none" stroke="#7ff5e1" stroke-width="5" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="88" y="136" width="24" height="10" fill="#1581c4" stroke="#1b1f5e" stroke-width="4"/>
  <!-- arms -->
  <rect x="28" y="152" width="22" height="42" rx="11" fill="#1581c4" stroke="#1b1f5e" stroke-width="4"/>
  <rect x="150" y="152" width="22" height="42" rx="11" fill="#1581c4" stroke="#1b1f5e" stroke-width="4"/>
  <!-- body -->
  <rect x="56" y="146" width="88" height="58" rx="18" fill="#4cc9f0" stroke="#1b1f5e" stroke-width="5"/>
  <!-- O on the chest -->
  <circle cx="100" cy="175" r="15" fill="none" stroke="#1b1f5e" stroke-width="8"/>
  <!-- feet -->
  <rect x="66" y="202" width="28" height="10" rx="5" fill="#1581c4" stroke="#1b1f5e" stroke-width="4"/>
  <rect x="106" y="202" width="28" height="10" rx="5" fill="#1581c4" stroke="#1b1f5e" stroke-width="4"/>
</svg>
